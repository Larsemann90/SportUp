}

function shuffleArr(arr) { return [...arr].sort(() => Math.random() - 0.5); }

// Baut eine erste K.-o.-Runde aus einer bereits geordneten Liste (beste zuerst).
// Freilose gehen an die vorderen Plätze, Rest wird "erster gegen letzter" gepaart.
// Für unges\u00e4te Situationen einfach eine zuf\u00e4llig gemischte Liste \u00fcbergeben.
function buildFirstKoRound(orderedIds) {
  let size = 1;
  while (size < orderedIds.length) size *= 2;
  const byesNeeded = size - orderedIds.length;
  const byeTeams = orderedIds.slice(0, byesNeeded);
  const playTeams = orderedIds.slice(byesNeeded);
  const matches = [];
  byeTeams.forEach(t => matches.push({ id: uid(), teamA: t, teamB: null, winner: t, bye: true, scoreA: null, scoreB: null }));
  let lo = 0, hi = playTeams.length - 1;
  while (lo < hi) {
    matches.push({ id: uid(), teamA: playTeams[lo], teamB: playTeams[hi], winner: null, bye: false, scoreA: null, scoreB: null });
    lo++; hi--;
  }
  return matches;
}

function buildNextKnockoutRound(prevMatches) {
  const winners = prevMatches.map(m => m.winner);
  if (winners.length <= 1) return null;
  const matches = [];
  for (let i = 0; i < winners.length; i += 2) {
    matches.push({ id: uid(), teamA: winners[i], teamB: winners[i + 1], winner: null, bye: false, scoreA: null, scoreB: null });
  }
  return matches;
}

function tryAdvanceKnockout(koRounds) {
  const last = koRounds[koRounds.length - 1];
  const allDecided = last.every(m => m.winner !== null && m.winner !== undefined);
  if (!allDecided || last.length <= 1) return;
  const next = buildNextKnockoutRound(last);
  if (next) koRounds.push(next);
}

function updateWinnerFromScore(m) {
  if (m.scoreA !== null && m.scoreA !== undefined && m.scoreB !== null && m.scoreB !== undefined) {
    if (m.scoreA > m.scoreB) m.winner = m.teamA;
    else if (m.scoreB > m.scoreA) m.winner = m.teamB;
    else m.winner = null;
  } else {
    m.winner = null;
  }
}

function computeStandings(teamIds, rounds) {
  const stats = {};
  teamIds.forEach(id => { stats[id] = { id, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 }; });
  rounds.forEach(round => round.forEach(m => {
    if (m.bye || m.teamB == null) return;
    if (m.scoreA == null || m.scoreB == null) return;
    if (stats[m.teamA] === undefined || stats[m.teamB] === undefined) return;
    stats[m.teamA].gf += m.scoreA; stats[m.teamA].ga += m.scoreB;
    stats[m.teamB].gf += m.scoreB; stats[m.teamB].ga += m.scoreA;
    if (m.scoreA > m.scoreB) { stats[m.teamA].wins++; stats[m.teamA].points += 3; stats[m.teamB].losses++; }
    else if (m.scoreB > m.scoreA) { stats[m.teamB].wins++; stats[m.teamB].points += 3; stats[m.teamA].losses++; }
    else { stats[m.teamA].draws++; stats[m.teamB].draws++; stats[m.teamA].points++; stats[m.teamB].points++; }
  }));
  return Object.values(stats).sort((a, b) => b.points - a.points || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
}

function buildRoundRobinRounds(teamIds, fieldsCount, withReturnLeg) {
  const pairs = [];
  for (let i = 0; i < teamIds.length; i++) {
    for (let j = i + 1; j < teamIds.length; j++) pairs.push([teamIds[i], teamIds[j]]);
  }
  pairs.sort(() => Math.random() - 0.5);
  const rounds = [];
  for (let i = 0; i < pairs.length; i += fieldsCount) {
    rounds.push(pairs.slice(i, i + fieldsCount).map(([a, b]) => ({ id: uid(), teamA: a, teamB: b, winner: null, bye: false, scoreA: null, scoreB: null, leg: 1 })));
  }
  if (withReturnLeg) {
    const returnPairs = pairs.map(([a, b]) => [b, a]).sort(() => Math.random() - 0.5);
    for (let i = 0; i < returnPairs.length; i += fieldsCount) {
      rounds.push(returnPairs.slice(i, i + fieldsCount).map(([a, b]) => ({ id: uid(), teamA: a, teamB: b, winner: null, bye: false, scoreA: null, scoreB: null, leg: 2 })));
    }
  }
  return rounds;
}

// Verteilt Teams m\u00f6glichst gleichm\u00e4\u00dfig auf `groupsCount` Gruppen.
function distributeIntoGroups(teamIds, groupsCount) {
  const g = Math.max(1, Math.min(groupsCount, Math.floor(teamIds.length / 2) || 1));
  const shuffled = shuffleArr(teamIds);
  const groups = Array.from({ length: g }, () => []);
  shuffled.forEach((id, idx) => groups[idx % g].push(id));
  return groups.map(ids => ({ teamIds: ids, rounds: null })); // rounds gesetzt vom Aufrufer
}

// Baut aus den Gruppen-Tabellen eine ges\u00e4te Qualifikanten-Liste (beste zuerst),
// abwechselnd nach Platzierung \u00fcber die Gruppen hinweg (1. aus jeder Gruppe, dann 2. usw.)
function rankedQualifiers(groups, advanceCount) {
  const standingsPerGroup = groups.map(g => computeStandings(g.teamIds, g.rounds));
  const qualifiers = [];
  for (let rank = 0; rank < advanceCount; rank++) {
    standingsPerGroup.forEach(standings => {
      if (standings[rank]) qualifiers.push(standings[rank].id);
    });
  }
  return qualifiers;
}

// ---- Doppel-K.-o. ----
function roundLosers(round) {
  return round.filter(m => !m.bye).map(m => (m.winner === m.teamA ? m.teamB : m.teamA));
}

function pairUp(list) {
  const matches = [];
  let i = 0;
  for (; i + 1 < list.length; i += 2) {
    matches.push({ id: uid(), teamA: list[i], teamB: list[i + 1], winner: null, bye: false, scoreA: null, scoreB: null });
  }
  if (list.length % 2 === 1) {
    const leftover = list[list.length - 1];
    matches.push({ id: uid(), teamA: leftover, teamB: null, winner: leftover, bye: true, scoreA: null, scoreB: null });
  }
  return matches;
}

function pairAcross(listA, listB) {
  const matches = [];
  const n = Math.min(listA.length, listB.length);
  for (let i = 0; i < n; i++) {
    matches.push({ id: uid(), teamA: listA[i], teamB: listB[i], winner: null, bye: false, scoreA: null, scoreB: null });
  }
  for (let i = n; i < listA.length; i++) matches.push({ id: uid(), teamA: listA[i], teamB: null, winner: listA[i], bye: true, scoreA: null, scoreB: null });
  for (let i = n; i < listB.length; i++) matches.push({ id: uid(), teamA: listB[i], teamB: null, winner: listB[i], bye: true, scoreA: null, scoreB: null });
  return matches;
}

function initDoubleElim(orderedOrShuffledIds, finalMode) {
  let size = 1;
  let r = 0;
  while (size < orderedOrShuffledIds.length) { size *= 2; r++; }
  r = Math.max(r, 1);
  return {
    wbRounds: [buildFirstKoRound(orderedOrShuffledIds)],
    wbTotalRounds: r,
    lbRounds: [],
    grandFinal: null,
    bracketReset: null,
    finalMode: finalMode, // "single" | "reset"
    champion: null,
  };
}

function allDecided(round) { return round.every(m => m.winner !== null && m.winner !== undefined); }

function advanceDoubleElim(de) {
  const R = de.wbTotalRounds;

  // Winner-Bracket weiterschalten
  const lastWb = de.wbRounds[de.wbRounds.length - 1];
  if (allDecided(lastWb) && lastWb.length > 1) {
    const next = buildNextKnockoutRound(lastWb);
    if (next) de.wbRounds.push(next);
  }

  // Verlierer-Bracket weiterschalten
  const totalLbRounds = 2 * (R - 1);
  const i = de.lbRounds.length + 1;
  if (i <= totalLbRounds) {
    if (i === 1) {
      if (de.wbRounds.length >= 1 && allDecided(de.wbRounds[0])) {
        const losers = roundLosers(de.wbRounds[0]);
        if (losers.length >= 1) de.lbRounds.push(pairUp(losers));
      }
    } else if (i % 2 === 0) {
      // Drop-down-Runde: Sieger der letzten LB-Runde vs. Verlierer der n\u00e4chsten WB-Runde
      const prevLb = de.lbRounds[i - 2];
      const wbRoundIdx = i / 2; // 1-basiert: WB-Runde (i/2 + 1) -> Array-Index i/2
      if (prevLb && allDecided(prevLb) && de.wbRounds.length > wbRoundIdx && allDecided(de.wbRounds[wbRoundIdx])) {
        const survivors = prevLb.map(m => m.winner);
        const droppers = roundLosers(de.wbRounds[wbRoundIdx]);
        de.lbRounds.push(pairAcross(survivors, droppers));
      }
    } else {
      // Konsolidierungsrunde: Sieger der letzten Drop-down-Runde spielen gegeneinander
      const prevLb = de.lbRounds[i - 2];
      if (prevLb && allDecided(prevLb)) {
        const survivors = prevLb.map(m => m.winner);
        de.lbRounds.push(pairUp(survivors));
      }
    }
  }

  // Grand Final ansetzen, sobald beide Brackets fertig sind
  const wbDone = de.wbRounds.length === R && allDecided(de.wbRounds[R - 1]) && de.wbRounds[R - 1].length === 1;
  const lbDone = totalLbRounds === 0
    ? (de.wbRounds.length >= 1 && allDecided(de.wbRounds[0]))
    : (de.lbRounds.length === totalLbRounds && allDecided(de.lbRounds[totalLbRounds - 1]));

  if (wbDone && lbDone && !de.grandFinal) {
    const wbChampion = de.wbRounds[R - 1][0].winner;
    const lbChampion = totalLbRounds === 0
      ? roundLosers(de.wbRounds[0])[0] // Sonderfall: nur 2 Teams insgesamt
      : de.lbRounds[totalLbRounds - 1][0].winner;
    if (wbChampion != null && lbChampion != null) {
      de.grandFinal = { teamA: wbChampion, teamB: lbChampion, winner: null, bye: false, scoreA: null, scoreB: null, id: uid() };
    }
  }

  // Bracket-Reset (2. Finale), falls gew\u00fcnscht und n\u00f6tig
  if (de.grandFinal && de.grandFinal.winner != null && de.finalMode === "reset" && !de.bracketReset) {
    const wbChampion = de.wbRounds[R - 1][0].winner;
    if (de.grandFinal.winner !== wbChampion) {
      de.bracketReset = { teamA: de.grandFinal.teamA, teamB: de.grandFinal.teamB, winner: null, bye: false, scoreA: null, scoreB: null, id: uid() };
    }
  }

  // Champion bestimmen
  if (de.bracketReset) {
    de.champion = de.bracketReset.winner;
  } else if (de.grandFinal && de.grandFinal.winner != null) {
    de.champion = de.grandFinal.winner;
  }
}

// ---- Schweizer System ----
function autoSwissRounds(n) {
  if (n <= 2) return 1;
  return Math.max(3, Math.min(n - 1, Math.ceil(Math.log2(n)) + 1));
}

function buildSwissRound(teamIds, previousRounds) {
  const stats = computeStandings(teamIds, previousRounds);
  const played = new Set();
  previousRounds.forEach(round => round.forEach(m => {
    if (!m.bye && m.teamB != null) { played.add(m.teamA + "-" + m.teamB); played.add(m.teamB + "-" + m.teamA); }
  }));
  const hadBye = new Set(previousRounds.flat().filter(m => m.bye).map(m => m.teamA));
  const order = stats.map(s => s.id);
  const available = [...order];
  const matches = [];

  if (available.length % 2 === 1) {
    let byeIdx = -1;
    for (let i = available.length - 1; i >= 0; i--) {
      if (!hadBye.has(available[i])) { byeIdx = i; break; }
    }
    if (byeIdx === -1) byeIdx = available.length - 1;
    const byeTeam = available.splice(byeIdx, 1)[0];
    matches.push({ id: uid(), teamA: byeTeam, teamB: null, winner: byeTeam, bye: true, scoreA: null, scoreB: null });
  }

  const usedThisRound = new Set();
  for (let i = 0; i < available.length; i++) {
    const a = available[i];
    if (usedThisRound.has(a)) continue;
    let opponent = null;
    for (let j = i + 1; j < available.length; j++) {
      const b = available[j];
      if (usedThisRound.has(b)) continue;
      if (!played.has(a + "-" + b)) { opponent = b; break; }
    }
    if (opponent === null) {
      for (let j = i + 1; j < available.length; j++) {
        const b = available[j];
        if (!usedThisRound.has(b)) { opponent = b; break; }
      }
    }
    if (opponent !== null) {
      matches.push({ id: uid(), teamA: a, teamB: opponent, winner: null, bye: false, scoreA: null, scoreB: null });
      usedThisRound.add(a); usedThisRound.add(opponent);
    }
  }
  return matches;
}

function getActiveTournament(c) {
  if (!c) return null;
  // Migration: altes Einzel-Turnier-Format in die neue Liste überführen
  if (c.tournament && !c.tournaments) {
    const migrated = { ...c.tournament, id: uid(), label: "Turnier 1", createdAt: Date.now() };
    c.tournaments = [migrated];
    c.activeTournamentId = migrated.id;
    delete c.tournament;
    saveState();
  }
  if (!c.tournaments) return null;
  return c.tournaments.find(t => t.id === c.activeTournamentId) || null;
}

function isTournamentComplete(t) {
  if (!t) return false;
  if (t.format === "roundrobin") return t.rounds.every(r => allDecided(r));
  if (t.format === "knockout") return t.koRounds[t.koRounds.length - 1].length === 1 && allDecided(t.koRounds[t.koRounds.length - 1]);
  if (t.format === "doubleElim") return t.de.champion != null;
  if (t.format === "groupsKnockout") return !!(t.koFromGroups && t.koFromGroups[t.koFromGroups.length - 1].length === 1 && allDecided(t.koFromGroups[t.koFromGroups.length - 1]));
  if (t.format === "groupsDoubleElim") return !!(t.deFromGroups && t.deFromGroups.champion != null);
  if (t.format === "swiss") return t.swiss.rounds.length >= t.swiss.totalRounds && allDecided(t.swiss.rounds[t.swiss.rounds.length - 1]);
  if (t.format === "swissKnockout") return !!(t.koFromSwiss && t.koFromSwiss[t.koFromSwiss.length - 1].length === 1 && allDecided(t.koFromSwiss[t.koFromSwiss.length - 1]));
  return false;
}

// ---- Platzierungsspiele (Spiel um Platz 3 / alle Platzierungen) ----
function collectRoundLosers(round) {
  return round.filter(m => !m.bye).map(m => (m.winner === m.teamA ? m.teamB : m.teamA));
}

function koTotalRoundsFor(n) {
  let s = 1, r = 0;
  while (s < n) { s *= 2; r++; }
  return Math.max(r, 1);
}

function spawnPlacementPools(rounds, totalRounds, parentKey, startRank, mode, pools) {
  rounds.forEach((round, ri) => {
    if (ri === totalRounds - 1) return; // letzte Runde vergibt Platz 1/2 direkt, kein Pool nötig
    if (!allDecided(round)) return;
    if (mode === "third" && (parentKey || ri !== totalRounds - 2)) return; // nur die oberste Halbfinal-Runde
    const key = (parentKey || "main") + "-r" + ri;
    if (pools.some(p => p.key === key)) return;
    const losers = collectRoundLosers(round);
    if (losers.length < 2) return;
    const poolStart = startRank + Math.pow(2, totalRounds - ri - 1);
    const poolEnd = startRank + Math.pow(2, totalRounds - ri) - 1;
    pools.push({ key, teamIds: losers, rounds: [buildFirstKoRound(losers)], startRank: poolStart, endRank: poolEnd, totalRounds: koTotalRoundsFor(losers.length) });
  });
}

function refreshPlacements(t) {
  if (!t.placementMode || t.placementMode === "none") return;
  let mainRounds = null;
  if (t.format === "knockout") mainRounds = t.koRounds;
  else if (t.format === "groupsKnockout") mainRounds = t.koFromGroups;
  else if (t.format === "swissKnockout") mainRounds = t.koFromSwiss;
  if (!mainRounds || !t.koTotalRounds) return;
  if (!t.placementPools) t.placementPools = [];
  spawnPlacementPools(mainRounds, t.koTotalRounds, null, 1, t.placementMode, t.placementPools);
  let i = 0;
  while (i < t.placementPools.length) {
    const p = t.placementPools[i];
    tryAdvanceKnockout(p.rounds);
    if (t.placementMode === "full") spawnPlacementPools(p.rounds, p.totalRounds, p.key, p.startRank, t.placementMode, t.placementPools);
    i++;
  }
}

function placementPoolLabel(p) {
  if (p.endRank - p.startRank === 1) return `Spiel um Platz ${p.startRank}`;
  return `Platzierungsspiele — Platz ${p.startRank}–${p.endRank}`;
}

function startTournament() {
  const c = getActiveClass();
  if (!c || !state.teams || state.teams.length < 2) return;
  const teamIds = state.teams.map(t => t.id);
  const teamNames = {};
  state.teams.forEach(t => { teamNames[t.id] = t.name; });
  const fieldsCount = Math.max(1, state.tourFields);
  if (!c.tournaments) c.tournaments = [];
  const tournament = {
    id: uid(),
    label: `Turnier ${c.tournaments.length + 1}`,
    createdAt: Date.now(),
    format: state.tourFormat, fieldsCount, teamIds, teamNames,
  };

  if (state.tourFormat === "roundrobin") {
    tournament.rounds = buildRoundRobinRounds(teamIds, fieldsCount, state.tourReturnLeg);
    tournament.returnLeg = state.tourReturnLeg;
  } else if (state.tourFormat === "knockout") {
    tournament.koRounds = [buildFirstKoRound(shuffleArr(teamIds))];
    tournament.placementMode = state.tourPlacement;
    tournament.placementPools = [];
    tournament.koTotalRounds = koTotalRoundsFor(teamIds.length);
  } else if (state.tourFormat === "doubleElim") {
    tournament.de = initDoubleElim(shuffleArr(teamIds), state.tourDeFinalMode);
  } else if (state.tourFormat === "groupsKnockout" || state.tourFormat === "groupsDoubleElim") {
    const groups = distributeIntoGroups(teamIds, state.tourGroupsCount);
    groups.forEach(g => { g.rounds = buildRoundRobinRounds(g.teamIds, fieldsCount, state.tourReturnLeg); });
    tournament.groups = groups;
    tournament.groupsAdvance = Math.max(1, state.tourGroupsAdvance);
    tournament.returnLeg = state.tourReturnLeg;
    tournament.koFromGroups = null;
    tournament.deFromGroups = null;
    tournament.placementMode = state.tourPlacement;
    tournament.placementPools = [];
  } else if (state.tourFormat === "swiss" || state.tourFormat === "swissKnockout") {
    const totalRounds = state.tourSwissRoundsMode === "manual" ? Math.max(1, state.tourSwissRoundsManual) : autoSwissRounds(teamIds.length);
    tournament.swiss = { rounds: [buildSwissRound(teamIds, [])], totalRounds };
    tournament.swissQualifiers = Math.max(2, state.tourSwissQualifiers);
    tournament.koFromSwiss = null;
    tournament.placementMode = state.tourPlacement;
    tournament.placementPools = [];
  }
  c.tournaments.push(tournament);
  c.activeTournamentId = tournament.id;
  saveState();
  render();
}

function startKnockoutFromGroups() {
  const c = getActiveClass();
  const t = getActiveTournament(c);
  if (!t) return;
  const qualifiers = rankedQualifiers(t.groups, t.groupsAdvance);
  if (qualifiers.length < 2) return;
  t.koFromGroups = [buildFirstKoRound(qualifiers)];
  t.koTotalRounds = koTotalRoundsFor(qualifiers.length);
  saveState();
  render();
}

function startDoubleElimFromGroups() {
  const c = getActiveClass();
  const t = getActiveTournament(c);
  if (!t) return;
  const qualifiers = rankedQualifiers(t.groups, t.groupsAdvance);
  if (qualifiers.length < 2) return;
  t.deFromGroups = initDoubleElim(qualifiers, state.tourDeFinalMode);
  saveState();
  render();
}

function startKnockoutFromSwiss() {
  const c = getActiveClass();
  const t = getActiveTournament(c);
  if (!t) return;
  const standings = computeStandings(t.teamIds, t.swiss.rounds);
  const qualifiers = standings.slice(0, t.swissQualifiers).map(s => s.id);
  if (qualifiers.length < 2) return;
  t.koFromSwiss = [buildFirstKoRound(qualifiers)];
  t.koTotalRounds = koTotalRoundsFor(qualifiers.length);
  saveState();
  render();
}

function closeTournament() {
  const c = getActiveClass();
  if (!c) return;
  c.activeTournamentId = null;
  saveState();
  render();
}

function openTournament(id) {
  const c = getActiveClass();
  if (!c) return;
  c.activeTournamentId = id;
  saveState();
  render();
}

function deleteTournament(id) {
  const c = getActiveClass();
  if (!c || !c.tournaments) return;
  c.tournaments = c.tournaments.filter(t => t.id !== id);
  if (c.activeTournamentId === id) c.activeTournamentId = null;
  saveState();
  render();
}

function renameTournament(id, label) {
  const c = getActiveClass();
  if (!c || !c.tournaments) return;
  const t = c.tournaments.find(t => t.id === id);
  if (t) t.label = label.trim() || t.label;
  saveState();
  render();
}

const PDF_ACCENT = [200, 68, 44];
const PDF_ACCENT2 = [216, 118, 42];
const PDF_INK = [30, 28, 26];
const PDF_MUTED = [125, 118, 110];
const PDF_CARD_BG = [250, 247, 242];
const PDF_CARD_LINE = [222, 213, 200];

function pdfBanner(doc, subtitle) {
  const pageWidth = doc.internal.pageSize.getWidth();
  const margin = 14;
  doc.setTextColor(...PDF_INK);
  doc.setFont(undefined, "bold"); doc.setFontSize(15);
  doc.text(subtitle, margin, 18);
  doc.setFont(undefined, "normal"); doc.setFontSize(11);
  return { doc, y: 26, pageWidth, pageHeight: doc.internal.pageSize.getHeight(), margin };
}

function pdfEnsureSpace(ctx, extra) {
  if (ctx.y + extra > ctx.pageHeight - ctx.margin) {
    ctx.doc.addPage();
    ctx.y = ctx.margin;
  }
}

function pdfMeta(ctx, lines) {
  ctx.doc.setFontSize(9.5); ctx.doc.setTextColor(...PDF_MUTED);
  lines.forEach(l => { pdfEnsureSpace(ctx, 5); ctx.doc.text(l, ctx.margin, ctx.y); ctx.y += 5; });
  ctx.doc.setTextColor(...PDF_INK); ctx.doc.setFontSize(11);
  ctx.y += 3;
}

function pdfSectionTitle(ctx, text) {
  pdfEnsureSpace(ctx, 10);
  ctx.doc.setFillColor(...PDF_ACCENT2);
  ctx.doc.rect(ctx.margin, ctx.y - 4.2, 3, 6, "F");
  ctx.doc.setFont(undefined, "bold"); ctx.doc.setFontSize(12.5);
  ctx.doc.setTextColor(...PDF_INK);
  ctx.doc.text(text, ctx.margin + 6, ctx.y);
  ctx.y += 7;
  ctx.doc.setFont(undefined, "normal"); ctx.doc.setFontSize(11);
}

function pdfSubLabel(ctx, text) {
  pdfEnsureSpace(ctx, 6);
  ctx.doc.setFont(undefined, "bold"); ctx.doc.setFontSize(9);
  ctx.doc.setTextColor(...PDF_ACCENT);
  ctx.doc.text(text.toUpperCase(), ctx.margin, ctx.y);
  ctx.y += 5.5;
  ctx.doc.setFont(undefined, "normal"); ctx.doc.setFontSize(11); ctx.doc.setTextColor(...PDF_INK);
}

// Eine Spielkarte mit echten Ausfüll-Boxen fürs Ergebnis (leer, falls noch nicht gespielt).
function pdfMatchCard(ctx, teamAName, teamBName, scoreA, scoreB, isBye) {
  const boxW = ctx.pageWidth - ctx.margin * 2;
  const boxH = isBye ? 9 : 13;
  pdfEnsureSpace(ctx, boxH + 3);
  const x = ctx.margin;
  ctx.doc.setDrawColor(...PDF_CARD_LINE);
  ctx.doc.setFillColor(...PDF_CARD_BG);
  ctx.doc.roundedRect(x, ctx.y, boxW, boxH, 2, 2, "FD");
  ctx.doc.setFontSize(10.5); ctx.doc.setTextColor(...PDF_INK);

  if (isBye) {
    ctx.doc.setFont(undefined, "normal");
    ctx.doc.text(`${teamAName}  —  Freilos`, x + 4, ctx.y + boxH / 2 + 1.5);
  } else {
    const midX = x + boxW / 2;
    const scoreBoxW = 11, scoreBoxH = 8, gap = 3;
    const sbY = ctx.y + (boxH - scoreBoxH) / 2;

    ctx.doc.setFont(undefined, "normal");
    ctx.doc.text(teamAName, x + 4, ctx.y + boxH / 2 + 1.5, { maxWidth: boxW * 0.32 });
    ctx.doc.text(teamBName, x + boxW - 4, ctx.y + boxH / 2 + 1.5, { align: "right", maxWidth: boxW * 0.32 });

    ctx.doc.setDrawColor(160, 150, 140);
    ctx.doc.setFillColor(255, 255, 255);
    ctx.doc.roundedRect(midX - scoreBoxW - gap / 2, sbY, scoreBoxW, scoreBoxH, 1.5, 1.5, "FD");
    ctx.doc.roundedRect(midX + gap / 2, sbY, scoreBoxW, scoreBoxH, 1.5, 1.5, "FD");
    ctx.doc.setFont(undefined, "bold"); ctx.doc.setFontSize(10.5);
    if (scoreA != null) ctx.doc.text(String(scoreA), midX - scoreBoxW - gap / 2 + scoreBoxW / 2, sbY + scoreBoxH / 2 + 1.4, { align: "center" });
    if (scoreB != null) ctx.doc.text(String(scoreB), midX + gap / 2 + scoreBoxW / 2, sbY + scoreBoxH / 2 + 1.4, { align: "center" });
    ctx.doc.setFont(undefined, "normal"); ctx.doc.setFontSize(10);
    ctx.doc.text(":", midX, ctx.y + boxH / 2 + 1.5, { align: "center" });
  }
  ctx.y += boxH + 3;
}

function pdfRoundLabel(ctx, text) {
  pdfEnsureSpace(ctx, 6);
  ctx.doc.setFont(undefined, "normal"); ctx.doc.setFontSize(9);
  ctx.doc.setTextColor(...PDF_MUTED);
  ctx.doc.text(text, ctx.margin, ctx.y);
  ctx.y += 4.5;
  ctx.doc.setFontSize(11); ctx.doc.setTextColor(...PDF_INK);
}

function pdfRounds(ctx, title, rounds) {
  pdfSectionTitle(ctx, title);
  let lastLeg = null;
  rounds.forEach((round, ridx) => {
    const leg = round[0] && round[0].leg;
    if (leg && leg !== lastLeg) { pdfSubLabel(ctx, leg === 1 ? "Hinrunde" : "Rückrunde"); lastLeg = leg; }
    pdfRoundLabel(ctx, `Runde ${ridx + 1}`);
    round.forEach(m => pdfMatchCard(ctx, labelForPdf(m.teamA), labelForPdf(m.teamB), m.scoreA, m.scoreB, m.bye));
  });
  ctx.y += 2;
  function labelForPdf(id) { return ctx.__label(id); }
}

// Leere, von Hand ausfüllbare Tabelle statt einer automatisch berechneten.
function pdfBlankStandings(ctx, teamNames) {
  pdfSectionTitle(ctx, "Tabelle — von Hand ausfüllen");
  const x = ctx.margin;
  const w = ctx.pageWidth - ctx.margin * 2;
  const colW = { platz: 13, team: w * 0.34, s: 11, u: 11, n: 11, tore: 20, punkte: w - 13 - w * 0.34 - 11 * 3 - 20 };
  const rowH = 9;

  pdfEnsureSpace(ctx, rowH + 2);
  let cx = x;
  ctx.doc.setFillColor(...PDF_ACCENT2);
  ctx.doc.rect(x, ctx.y, w, rowH, "F");
  ctx.doc.setFont(undefined, "bold"); ctx.doc.setFontSize(9); ctx.doc.setTextColor(255, 255, 255);
  [["Platz", colW.platz], ["Team", colW.team], ["S", colW.s], ["U", colW.u], ["N", colW.n], ["Tore", colW.tore], ["Punkte", colW.punkte]].forEach(([label, cw]) => {
    ctx.doc.text(label, cx + 2, ctx.y + rowH / 2 + 1.2);
    cx += cw;
  });
  ctx.y += rowH;

  ctx.doc.setFont(undefined, "normal"); ctx.doc.setFontSize(10); ctx.doc.setTextColor(...PDF_INK);
  teamNames.forEach((name, idx) => {
    pdfEnsureSpace(ctx, rowH);
    cx = x;
    ctx.doc.setDrawColor(...PDF_CARD_LINE);
    ctx.doc.rect(x, ctx.y, w, rowH);
    [colW.platz, colW.team, colW.s, colW.u, colW.n, colW.tore, colW.punkte].forEach((cw, i) => {
      if (i > 0) ctx.doc.line(cx, ctx.y, cx, ctx.y + rowH);
      cx += cw;
    });
    ctx.doc.text(String(idx + 1) + ".", x + 2, ctx.y + rowH / 2 + 1.2);
    ctx.doc.text(name, x + colW.platz + 2, ctx.y + rowH / 2 + 1.2, { maxWidth: colW.team - 4 });
    ctx.y += rowH;
  });
  ctx.y += 4;
}

// ---- Vorausschauende Spielpläne für den PDF-Export (à la WM-Turnierplan) ----
function pdfKoRoundName(distFromEnd) {
  const names = ["Finale", "Halbfinale", "Viertelfinale", "Achtelfinale", "Sechzehntelfinale"];
  return names[distFromEnd] || null;
}

// Baut die komplette K.-o.-Kette (inkl. noch nicht gespielter Runden) aus den
// bereits vorhandenen echten Runden. Noch unbekannte Gegner werden als
// "Sieger <Runde> <Spielnummer>" angezeigt und lösen sich automatisch auf,
// sobald in der App echte Ergebnisse eingetragen werden.
function pdfBuildKoChainFromReal(realRoundsNormalized) {
  const rounds = realRoundsNormalized.slice();
  let count = rounds[rounds.length - 1].length;
  while (count > 1) { count = Math.ceil(count / 2); rounds.push(new Array(count).fill(null)); }
  const total = rounds.length;
  const realCount = realRoundsNormalized.length;
  function nameFor(ri) { const d = total - 1 - ri; const n = pdfKoRoundName(d); return n || `Runde ${ri + 1}`; }
  for (let ri = realCount; ri < total; ri++) {
    const prev = rounds[ri - 1];
    const prevName = nameFor(ri - 1);
    const n = rounds[ri].length;
    for (let i = 0; i < n; i++) {
      const m1 = prev[2 * i], m2 = prev[2 * i + 1];
      const resolve = (m, idx) => {
        if (!m) return null;
        if (m.winnerName) return m.winnerName;
        return `Sieger ${prevName}${prev.length > 1 ? " " + (idx + 1) : ""}`;
      };
      if (!m2) {
        rounds[ri][i] = { aName: resolve(m1, 2 * i), bName: null, scoreA: null, scoreB: null, isBye: true, winnerName: (m1 && m1.winnerName) || null };
      } else {
        rounds[ri][i] = { aName: resolve(m1, 2 * i), bName: resolve(m2, 2 * i + 1), scoreA: null, scoreB: null, isBye: false, winnerName: null };
      }
    }
  }
  return { rounds, names: rounds.map((_, ri) => nameFor(ri)) };
}

function pdfNormalizeMatch(m, labelFn) {
  return {
    aName: labelFn(m.teamA), bName: m.bye ? null : labelFn(m.teamB),
    scoreA: m.scoreA, scoreB: m.scoreB, isBye: m.bye,
    winnerName: m.winner != null ? labelFn(m.winner) : null,
  };
}

// Baut Winner- und Verlierer-Bracket vollständig voraus (Doppel-K.-o.).
function pdfBuildDoubleElimChain(wbSeedNormalized) {
  const wbChain = pdfBuildKoChainFromReal(wbSeedNormalized);
  const totalWbRounds = wbChain.rounds.length;
  const totalLbRounds = 2 * (totalWbRounds - 1);

  function wbLoser(ri, idx) {
    const m = wbChain.rounds[ri][idx];
    if (!m || m.isBye) return null;
    if (m.winnerName) return m.winnerName === m.aName ? m.bName : m.aName;
    return `Verlierer ${wbChain.names[ri]}${wbChain.rounds[ri].length > 1 ? " " + (idx + 1) : ""}`;
  }

  const lbRounds = [];
  const lbNames = [];
  for (let i = 1; i <= totalLbRounds; i++) {
    const name = i === totalLbRounds ? "Verlierer-Finale" : `Verlierer-Runde ${i}`;
    lbNames.push(name);
    if (i === 1) {
      const wbR0 = wbChain.rounds[0];
      const realMatches = wbR0.filter(m => !m.isBye);
      const losers = realMatches.map(m => wbLoser(0, wbR0.indexOf(m)));
      const round = [];
      for (let k = 0; k + 1 < losers.length; k += 2) round.push({ aName: losers[k], bName: losers[k + 1], isBye: false, winnerName: null });
      if (losers.length % 2 === 1) round.push({ aName: losers[losers.length - 1], bName: null, isBye: true, winnerName: losers[losers.length - 1] });
      lbRounds.push(round);
    } else if (i % 2 === 0) {
      const prevLb = lbRounds[i - 2];
      const survivors = prevLb.map((m, idx2) => m.winnerName || `Sieger ${lbNames[i - 2]}${prevLb.length > 1 ? " " + (idx2 + 1) : ""}`);
      const wbRoundIdx = i / 2;
      const wbRound = wbChain.rounds[wbRoundIdx] || [];
      const droppers = wbRound.map((m, idx2) => wbLoser(wbRoundIdx, idx2)).filter(x => x != null);
      const n = Math.min(survivors.length, droppers.length);
      const round = [];
      for (let k = 0; k < n; k++) round.push({ aName: survivors[k], bName: droppers[k], isBye: false, winnerName: null });
      lbRounds.push(round);
    } else {
      const prevLb = lbRounds[i - 2];
      const survivors = prevLb.map((m, idx2) => m.winnerName || `Sieger ${lbNames[i - 2]}${prevLb.length > 1 ? " " + (idx2 + 1) : ""}`);
      const round = [];
      for (let k = 0; k + 1 < survivors.length; k += 2) round.push({ aName: survivors[k], bName: survivors[k + 1], isBye: false, winnerName: null });
      lbRounds.push(round);
    }
  }
  return { wbChain, lbRounds, lbNames };
}

// Platzhalter-Labels für die Qualifikanten aus Gruppen, solange die Gruppenphase
// noch nicht abgeschlossen ist (z. B. "1. Gruppe A").
function pdfVirtualGroupQualifierLabels(groupsCount, advanceCount) {
  const labels = [];
  for (let rank = 0; rank < advanceCount; rank++) {
    for (let g = 0; g < groupsCount; g++) labels.push(`${rank + 1}. Gruppe ${String.fromCharCode(65 + g)}`);
  }
  return labels;
}

function pdfPrintKoChain(ctx, chain) {
  chain.rounds.forEach((round, ri) => {
    pdfSectionTitle(ctx, chain.names[ri]);
    round.forEach(m => pdfMatchCard(ctx, m.aName, m.bName, m.scoreA, m.scoreB, m.isBye));
  });
}

function pdfPrintDoubleElimChain(ctx, dechain, grandFinalReal, bracketResetReal) {
  pdfPrintKoChain(ctx, dechain.wbChain);
  dechain.lbRounds.forEach((round, ri) => {
    pdfSectionTitle(ctx, dechain.lbNames[ri]);
    round.forEach(m => pdfMatchCard(ctx, m.aName, m.bName, m.scoreA, m.scoreB, m.isBye));
  });
  const wbLastRound = dechain.wbChain.rounds[dechain.wbChain.rounds.length - 1];
  const wbChampionName = wbLastRound[0].winnerName || `Sieger ${dechain.wbChain.names[dechain.wbChain.names.length - 1]}`;
  const lbLast = dechain.lbRounds[dechain.lbRounds.length - 1];
  const lbChampionName = (lbLast && lbLast[0] && (lbLast[0].winnerName || `Sieger ${dechain.lbNames[dechain.lbNames.length - 1]}`)) || null;
  pdfSectionTitle(ctx, "Grand Final");
  if (grandFinalReal) {
    pdfMatchCard(ctx, grandFinalReal.aName, grandFinalReal.bName, grandFinalReal.scoreA, grandFinalReal.scoreB, false);
  } else {
    pdfMatchCard(ctx, wbChampionName, lbChampionName, null, null, false);
  }
  if (bracketResetReal) {
    pdfSectionTitle(ctx, "Finale — 2. Spiel (Bracket-Reset)");
    pdfMatchCard(ctx, bracketResetReal.aName, bracketResetReal.bName, bracketResetReal.scoreA, bracketResetReal.scoreB, false);
  }
}

function exportTournamentPDF(activeClass, t) {
  if (!t) return;
  if (!window.jspdf) {
    alert("Die PDF-Funktion konnte nicht geladen werden. Bitte prüfe deine Internetverbindung und versuch es erneut.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const formatLabel = (TOUR_FORMATS.find(f => f.key === t.format) || {}).label || t.format;
  const ctx = pdfBanner(doc, "Turnierplan");
  ctx.__label = (id) => (t.teamNames && t.teamNames[id]) || `Team ${id + 1}`;
  pdfMeta(ctx, [
    `${activeClass.name}  ·  ${t.label}`,
    `${formatLabel}  ·  erstellt am ${new Date(t.createdAt || Date.now()).toLocaleDateString("de-DE")}`,
  ]);

  if (t.format === "roundrobin") {
    pdfRounds(ctx, "Spielplan", t.rounds);
    pdfBlankStandings(ctx, t.teamIds.map(ctx.__label));
  } else if (t.format === "knockout") {
    const seed = t.koRounds.map(round => round.map(m => pdfNormalizeMatch(m, ctx.__label)));
    pdfPrintKoChain(ctx, pdfBuildKoChainFromReal(seed));
  } else if (t.format === "doubleElim") {
    const seed = t.de.wbRounds.map(round => round.map(m => pdfNormalizeMatch(m, ctx.__label)));
    const dechain = pdfBuildDoubleElimChain(seed);
    pdfPrintDoubleElimChain(ctx, dechain,
      t.de.grandFinal ? pdfNormalizeMatch(t.de.grandFinal, ctx.__label) : null,
      t.de.bracketReset ? pdfNormalizeMatch(t.de.bracketReset, ctx.__label) : null);
  } else if (t.format === "groupsKnockout" || t.format === "groupsDoubleElim") {
    t.groups.forEach((g, gi) => {
      pdfRounds(ctx, `Gruppe ${String.fromCharCode(65 + gi)}`, g.rounds);
      pdfBlankStandings(ctx, g.teamIds.map(ctx.__label));
    });
    const groupsAllDone = t.groups.every(g => g.rounds.every(r => allDecided(r)));

    if (t.format === "groupsKnockout") {
      let seed;
      if (t.koFromGroups) {
        seed = t.koFromGroups.map(round => round.map(m => pdfNormalizeMatch(m, ctx.__label)));
      } else {
        const labels = groupsAllDone
          ? rankedQualifiers(t.groups, t.groupsAdvance).map(ctx.__label)
          : pdfVirtualGroupQualifierLabels(t.groups.length, t.groupsAdvance);
        seed = [buildFirstKoRound(labels).map(m => ({
          aName: m.teamA, bName: m.bye ? null : m.teamB, scoreA: null, scoreB: null,
          isBye: m.bye, winnerName: groupsAllDone && m.bye ? m.teamA : null,
        }))];
      }
      pdfPrintKoChain(ctx, pdfBuildKoChainFromReal(seed));
    } else {
      let seed;
      if (t.deFromGroups) {
        seed = t.deFromGroups.wbRounds.map(round => round.map(m => pdfNormalizeMatch(m, ctx.__label)));
      } else {
        const labels = groupsAllDone
          ? rankedQualifiers(t.groups, t.groupsAdvance).map(ctx.__label)
          : pdfVirtualGroupQualifierLabels(t.groups.length, t.groupsAdvance);
        seed = [buildFirstKoRound(labels).map(m => ({
          aName: m.teamA, bName: m.bye ? null : m.teamB, scoreA: null, scoreB: null,
          isBye: m.bye, winnerName: groupsAllDone && m.bye ? m.teamA : null,
        }))];
      }
      const dechain = pdfBuildDoubleElimChain(seed);
      pdfPrintDoubleElimChain(ctx, dechain,
        t.deFromGroups && t.deFromGroups.grandFinal ? pdfNormalizeMatch(t.deFromGroups.grandFinal, ctx.__label) : null,
        t.deFromGroups && t.deFromGroups.bracketReset ? pdfNormalizeMatch(t.deFromGroups.bracketReset, ctx.__label) : null);
    }
  } else if (t.format === "swiss" || t.format === "swissKnockout") {
    pdfRounds(ctx, "Schweizer System", t.swiss.rounds);
    pdfBlankStandings(ctx, t.teamIds.map(ctx.__label));
    if (t.format === "swissKnockout") {
      const swissAllDone = t.swiss.rounds.length >= t.swiss.totalRounds && allDecided(t.swiss.rounds[t.swiss.rounds.length - 1]);
      let seed;
      if (t.koFromSwiss) {
        seed = t.koFromSwiss.map(round => round.map(m => pdfNormalizeMatch(m, ctx.__label)));
      } else {
        const labels = swissAllDone
          ? computeStandings(t.teamIds, t.swiss.rounds).slice(0, t.swissQualifiers).map(s => ctx.__label(s.id))
          : Array.from({ length: t.swissQualifiers }, (_, i) => `${i + 1}. Schweizer System`);
        seed = [buildFirstKoRound(labels).map(m => ({
          aName: m.teamA, bName: m.bye ? null : m.teamB, scoreA: null, scoreB: null,
          isBye: m.bye, winnerName: swissAllDone && m.bye ? m.teamA : null,
        }))];
      }
      pdfPrintKoChain(ctx, pdfBuildKoChainFromReal(seed));
    }
  }

  const filenameSafe = (activeClass.name + "_" + t.label).replace(/[^a-z0-9äöüß]+/gi, "_");
  doc.save(`Turnierplan_${filenameSafe}.pdf`);
}

function exportTeamsPDF(activeClass) {
  if (!state.teams || state.teams.length === 0) return;
  if (!window.jspdf) {
    alert("Die PDF-Funktion konnte nicht geladen werden. Bitte prüfe deine Internetverbindung und versuch es erneut.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const ctx = pdfBanner(doc, "Teamübersicht");
  pdfMeta(ctx, [
    `${activeClass.name}`,
    `${state.teams.length} Teams  ·  erstellt am ${new Date().toLocaleDateString("de-DE")}`,
  ]);

  state.teams.forEach(team => {
    pdfEnsureSpace(ctx, 16);
    const w = ctx.pageWidth - ctx.margin * 2;
    const headerH = 9;
    ctx.doc.setFillColor(...PDF_ACCENT2);
    ctx.doc.roundedRect(ctx.margin, ctx.y, w, headerH, 2, 2, "F");
    ctx.doc.setFont(undefined, "bold"); ctx.doc.setFontSize(11.5); ctx.doc.setTextColor(255, 255, 255);
    ctx.doc.text(team.name, ctx.margin + 4, ctx.y + headerH / 2 + 1.3);
    ctx.doc.setFontSize(9.5);
    ctx.doc.text(`${team.students.length} Schüler:in${team.students.length === 1 ? "" : "nen"}`, ctx.margin + w - 4, ctx.y + headerH / 2 + 1.3, { align: "right" });
    ctx.y += headerH;

    if (team.students.length === 0) {
      ctx.doc.setDrawColor(...PDF_CARD_LINE); ctx.doc.setFillColor(...PDF_CARD_BG);
      ctx.doc.rect(ctx.margin, ctx.y, w, 8, "FD");
      ctx.doc.setFont(undefined, "normal"); ctx.doc.setFontSize(10); ctx.doc.setTextColor(...PDF_MUTED);
      ctx.doc.text("— keine Schüler:innen —", ctx.margin + 4, ctx.y + 5.5);
      ctx.y += 8 + 3;
    } else {
      const rowH = 8;
      pdfEnsureSpace(ctx, rowH * team.students.length);
      team.students.forEach((s, idx) => {
        pdfEnsureSpace(ctx, rowH);
        ctx.doc.setDrawColor(...PDF_CARD_LINE);
        ctx.doc.setFillColor(idx % 2 === 0 ? 255 : PDF_CARD_BG[0], idx % 2 === 0 ? 255 : PDF_CARD_BG[1], idx % 2 === 0 ? 255 : PDF_CARD_BG[2]);
        ctx.doc.rect(ctx.margin, ctx.y, w, rowH, "FD");
        ctx.doc.setFont(undefined, "normal"); ctx.doc.setFontSize(10.5); ctx.doc.setTextColor(...PDF_INK);
        ctx.doc.setDrawColor(140, 130, 120);
        ctx.doc.rect(ctx.margin + 3.5, ctx.y + rowH / 2 - 2.2, 4.4, 4.4);
        ctx.doc.text(s.name, ctx.margin + 12, ctx.y + rowH / 2 + 1.3);
        ctx.y += rowH;
      });
      ctx.y += 4;
    }
  });

  const filenameSafe = activeClass.name.replace(/[^a-z0-9äöüß]+/gi, "_");
  doc.save(`Teamliste_${filenameSafe}.pdf`);
}

// ---- Word-Export (bearbeitbare .doc-Datei, gleiche Turnierbaum-Logik wie das PDF) ----
function wordEscape(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function downloadWordFile(filename, bodyHtml) {
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset="utf-8"><title>SportUp</title>
<style>
  body{font-family:Calibri,Arial,sans-serif;color:#1E1C1A;font-size:11pt;}
  h1{color:#C8442C;font-size:20pt;margin:0 0 4pt 0;}
  h2{color:#D9762A;font-size:13pt;margin:16pt 0 4pt 0;border-bottom:1pt solid #D9762A;padding-bottom:2pt;}
  .meta{color:#666666;font-size:10pt;margin-bottom:10pt;}
  .roundlabel{font-weight:bold;font-size:9.5pt;color:#888888;margin:8pt 0 3pt 0;}
  table{border-collapse:collapse;width:100%;margin-bottom:6pt;}
  td,th{border:1pt solid #cccccc;padding:4pt 6pt;font-size:10.5pt;}
  th{background:#D9762A;color:#ffffff;text-align:left;}
  .scorecell{text-align:center;width:70px;}
</style></head>
<body>${bodyHtml}</body></html>`;
  const blob = new Blob(["\ufeff", html], { type: "application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function wordMatchRowHtml(m) {
  if (m.isBye) {
    return `<tr><td>${wordEscape(m.aName)} — Freilos</td><td class="scorecell">—</td><td></td></tr>`;
  }
  const score = (m.scoreA != null && m.scoreB != null) ? `${m.scoreA} : ${m.scoreB}` : "__ : __";
  return `<tr><td>${wordEscape(m.aName)}</td><td class="scorecell">${score}</td><td>${wordEscape(m.bName)}</td></tr>`;
}

function wordRoundsHtml(title, rounds) {
  let html = `<h2>${wordEscape(title)}</h2>`;
  let lastLeg = null;
  rounds.forEach((round, ri) => {
    const leg = round[0] && round[0].leg;
    if (leg && leg !== lastLeg) { html += `<div class="roundlabel">${leg === 1 ? "Hinrunde" : "Rückrunde"}</div>`; lastLeg = leg; }
    html += `<div class="roundlabel">Runde ${ri + 1}</div><table><tbody>`;
    round.forEach(m => { html += wordMatchRowHtml(m); });
    html += `</tbody></table>`;
  });
  return html;
}

function wordKoChainHtml(chain) {
  let html = "";
  chain.rounds.forEach((round, ri) => {
    html += `<h2>${wordEscape(chain.names[ri])}</h2><table><tbody>`;
    round.forEach(m => { html += wordMatchRowHtml(m); });
    html += `</tbody></table>`;
  });
  return html;
}

function wordDoubleElimHtml(dechain, grandFinalReal, bracketResetReal) {
  let html = wordKoChainHtml(dechain.wbChain);
  dechain.lbRounds.forEach((round, ri) => {
    html += `<h2>${wordEscape(dechain.lbNames[ri])}</h2><table><tbody>`;
    round.forEach(m => { html += wordMatchRowHtml(m); });
    html += `</tbody></table>`;
  });
  const wbLastRound = dechain.wbChain.rounds[dechain.wbChain.rounds.length - 1];
  const wbChampionName = wbLastRound[0].winnerName || `Sieger ${dechain.wbChain.names[dechain.wbChain.names.length - 1]}`;
  const lbLast = dechain.lbRounds[dechain.lbRounds.length - 1];
  const lbChampionName = (lbLast && lbLast[0] && (lbLast[0].winnerName || `Sieger ${dechain.lbNames[dechain.lbNames.length - 1]}`)) || null;
  html += `<h2>Grand Final</h2><table><tbody>`;
  html += grandFinalReal
    ? wordMatchRowHtml(grandFinalReal)
    : wordMatchRowHtml({ aName: wbChampionName, bName: lbChampionName, scoreA: null, scoreB: null, isBye: false });
  html += `</tbody></table>`;
  if (bracketResetReal) {
    html += `<h2>Finale — 2. Spiel (Bracket-Reset)</h2><table><tbody>${wordMatchRowHtml(bracketResetReal)}</tbody></table>`;
  }
  return html;
}

function wordBlankStandingsHtml(teamNames) {
  let html = `<h2>Tabelle — von Hand ausfüllen</h2><table><thead><tr>
    <th style="width:30px">Platz</th><th>Team</th><th style="width:24px">S</th><th style="width:24px">U</th><th style="width:24px">N</th><th style="width:50px">Tore</th><th style="width:50px">Punkte</th>
  </tr></thead><tbody>`;
  teamNames.forEach((name, idx) => {
    html += `<tr><td>${idx + 1}.</td><td>${wordEscape(name)}</td><td></td><td></td><td></td><td></td><td></td></tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function exportTournamentWord(activeClass, t) {
  if (!t) return;
  const formatLabel = (TOUR_FORMATS.find(f => f.key === t.format) || {}).label || t.format;
  function label(id) { return (t.teamNames && t.teamNames[id]) || `Team ${id + 1}`; }

  let html = `<h1>Turnierplan</h1><div class="meta">${wordEscape(activeClass.name)} · ${wordEscape(t.label)}<br>${wordEscape(formatLabel)} · erstellt am ${new Date(t.createdAt || Date.now()).toLocaleDateString("de-DE")}</div>`;

  function doubleElimHtml(de) {
    return wordDoubleElimHtml(
      pdfBuildDoubleElimChain(de.wbRounds.map(round => round.map(m => pdfNormalizeMatch(m, label)))),
      de.grandFinal ? pdfNormalizeMatch(de.grandFinal, label) : null,
      de.bracketReset ? pdfNormalizeMatch(de.bracketReset, label) : null
    );
  }

  if (t.format === "roundrobin") {
    html += wordRoundsHtml("Spielplan", t.rounds.map(round => round.map(m => pdfNormalizeMatch(m, label))));
    html += wordBlankStandingsHtml(t.teamIds.map(label));
  } else if (t.format === "knockout") {
    const seed = t.koRounds.map(round => round.map(m => pdfNormalizeMatch(m, label)));
    html += wordKoChainHtml(pdfBuildKoChainFromReal(seed));
  } else if (t.format === "doubleElim") {
    html += doubleElimHtml(t.de);
  } else if (t.format === "groupsKnockout" || t.format === "groupsDoubleElim") {
    t.groups.forEach((g, gi) => {
      html += wordRoundsHtml(`Gruppe ${String.fromCharCode(65 + gi)}`, g.rounds.map(round => round.map(m => pdfNormalizeMatch(m, label))));
      html += wordBlankStandingsHtml(g.teamIds.map(label));
    });
    const groupsAllDone = t.groups.every(g => g.rounds.every(r => allDecided(r)));
    if (t.format === "groupsKnockout") {
      let seed;
      if (t.koFromGroups) {
        seed = t.koFromGroups.map(round => round.map(m => pdfNormalizeMatch(m, label)));
      } else {
        const labels = groupsAllDone ? rankedQualifiers(t.groups, t.groupsAdvance).map(label) : pdfVirtualGroupQualifierLabels(t.groups.length, t.groupsAdvance);
        seed = [buildFirstKoRound(labels).map(m => ({ aName: m.teamA, bName: m.bye ? null : m.teamB, scoreA: null, scoreB: null, isBye: m.bye, winnerName: groupsAllDone && m.bye ? m.teamA : null }))];
      }
      html += wordKoChainHtml(pdfBuildKoChainFromReal(seed));
    } else {
      let seed;
      if (t.deFromGroups) {
        seed = t.deFromGroups.wbRounds.map(round => round.map(m => pdfNormalizeMatch(m, label)));
      } else {
        const labels = groupsAllDone ? rankedQualifiers(t.groups, t.groupsAdvance).map(label) : pdfVirtualGroupQualifierLabels(t.groups.length, t.groupsAdvance);
        seed = [buildFirstKoRound(labels).map(m => ({ aName: m.teamA, bName: m.bye ? null : m.teamB, scoreA: null, scoreB: null, isBye: m.bye, winnerName: groupsAllDone && m.bye ? m.teamA : null }))];
      }
      html += wordDoubleElimHtml(
        pdfBuildDoubleElimChain(seed),
        t.deFromGroups && t.deFromGroups.grandFinal ? pdfNormalizeMatch(t.deFromGroups.grandFinal, label) : null,
        t.deFromGroups && t.deFromGroups.bracketReset ? pdfNormalizeMatch(t.deFromGroups.bracketReset, label) : null
      );
    }
  } else if (t.format === "swiss" || t.format === "swissKnockout") {
    html += wordRoundsHtml("Schweizer System", t.swiss.rounds.map(round => round.map(m => pdfNormalizeMatch(m, label))));
    html += wordBlankStandingsHtml(t.teamIds.map(label));
    if (t.format === "swissKnockout") {
      const swissAllDone = t.swiss.rounds.length >= t.swiss.totalRounds && allDecided(t.swiss.rounds[t.swiss.rounds.length - 1]);
      let seed;
      if (t.koFromSwiss) {
        seed = t.koFromSwiss.map(round => round.map(m => pdfNormalizeMatch(m, label)));
      } else {
        const labels = swissAllDone ? computeStandings(t.teamIds, t.swiss.rounds).slice(0, t.swissQualifiers).map(s => label(s.id)) : Array.from({ length: t.swissQualifiers }, (_, i) => `${i + 1}. Schweizer System`);
        seed = [buildFirstKoRound(labels).map(m => ({ aName: m.teamA, bName: m.bye ? null : m.teamB, scoreA: null, scoreB: null, isBye: m.bye, winnerName: swissAllDone && m.bye ? m.teamA : null }))];
      }
      html += wordKoChainHtml(pdfBuildKoChainFromReal(seed));
    }
  }

  const filenameSafe = (activeClass.name + "_" + t.label).replace(/[^a-z0-9äöüß]+/gi, "_");
  downloadWordFile(`Turnierplan_${filenameSafe}.doc`, html);
}

function exportTeamsWord(activeClass) {
  if (!state.teams || state.teams.length === 0) return;
  let html = `<h1>Teamübersicht</h1><div class="meta">${wordEscape(activeClass.name)}<br>${state.teams.length} Teams · erstellt am ${new Date().toLocaleDateString("de-DE")}</div>`;
  state.teams.forEach(team => {
    html += `<h2>${wordEscape(team.name)} (${team.students.length})</h2>`;
    if (team.students.length === 0) {
      html += `<p style="color:#888888">— keine Schüler:innen —</p>`;
    } else {
      html += `<table><tbody>`;
      team.students.forEach(s => { html += `<tr><td style="width:24px">☐</td><td>${wordEscape(s.name)}</td></tr>`; });
      html += `</tbody></table>`;
    }
  });
  const filenameSafe = activeClass.name.replace(/[^a-z0-9äöüß]+/gi, "_");
  downloadWordFile(`Teamliste_${filenameSafe}.doc`, html);
}

const TOUR_FORMATS = [
  { key: "roundrobin", label: "Alle gegen alle" },
  { key: "knockout", label: "K.-o.-System" },
  { key: "groupsKnockout", label: "Gruppenphase + K.-o." },
  { key: "doubleElim", label: "Doppel-K.-o." },
  { key: "groupsDoubleElim", label: "Gruppenphase + Doppel-K.-o." },
  { key: "swiss", label: "Schweizer System" },
  { key: "swissKnockout", label: "Schweizer System + K.-o." },
];

function renderTournamentView(activeClass) {
  const wrap = el("div", { class: "content" });

  const t = getActiveTournament(activeClass);
  const names = t ? t.teamNames : Object.fromEntries((state.teams || []).map(x => [x.id, x.name]));
  function label(id) { return (names && names[id]) || `Team ${id + 1}`; }

  function matchRow(m, requireWinner) {
    const row = el("div", { class: "roster-row" });
    if (m.bye) {
      row.appendChild(el("span", { class: "roster-name" }, `${label(m.teamA)} — Freilos`));
      return row;
    }
    const inner = el("div", { style: "display:flex;flex-direction:column;gap:8px;flex:1" });
    inner.appendChild(el("span", { class: "roster-name" }, `${label(m.teamA)}  vs  ${label(m.teamB)}`));

    const scoreRow = el("div", { style: "display:flex;align-items:center;gap:8px" });
    const inputA = el("input", {
      type: "number", min: "0", inputmode: "numeric", class: "text-input",
      style: "width:60px;text-align:center;padding:8px;flex:none",
      value: m.scoreA !== null && m.scoreA !== undefined ? String(m.scoreA) : "",
      placeholder: "–",
    });
    inputA.addEventListener("change", (e) => {
      const v = e.target.value === "" ? null : parseInt(e.target.value, 10);
      m.scoreA = (v === null || isNaN(v)) ? null : v;
      updateWinnerFromScore(m);
      saveState(); render();
    });
    const sep = el("span", { style: "color:var(--muted)" }, ":");
    const inputB = el("input", {
      type: "number", min: "0", inputmode: "numeric", class: "text-input",
      style: "width:60px;text-align:center;padding:8px;flex:none",
      value: m.scoreB !== null && m.scoreB !== undefined ? String(m.scoreB) : "",
      placeholder: "–",
    });
    inputB.addEventListener("change", (e) => {
      const v = e.target.value === "" ? null : parseInt(e.target.value, 10);
      m.scoreB = (v === null || isNaN(v)) ? null : v;
      updateWinnerFromScore(m);
      saveState(); render();
    });
    scoreRow.appendChild(inputA);
    scoreRow.appendChild(sep);
    scoreRow.appendChild(inputB);
    inner.appendChild(scoreRow);

    const bothEntered = m.scoreA !== null && m.scoreA !== undefined && m.scoreB !== null && m.scoreB !== undefined;
    if (bothEntered) {
      if (m.scoreA === m.scoreB) {
        if (requireWinner) {
          inner.appendChild(el("div", { class: "control-hint", style: "color:#E8A798" }, "Unentschieden — wer kommt weiter?"));
          inner.appendChild(el("div", { class: "mode-row" }, [
            el("button", { class: "mode-btn" + (m.winner === m.teamA ? " active" : ""), onClick: () => { m.winner = m.teamA; saveState(); render(); } }, label(m.teamA)),
            el("button", { class: "mode-btn" + (m.winner === m.teamB ? " active" : ""), onClick: () => { m.winner = m.teamB; saveState(); render(); } }, label(m.teamB)),
          ]));
        } else {
          inner.appendChild(el("div", { class: "control-hint" }, "Unentschieden"));
        }
      } else {
        inner.appendChild(el("div", { class: "control-hint" }, `Sieger: ${label(m.winner)}`));
      }
    }
    row.appendChild(inner);
    return row;
  }

  function standingsTable(teamIds, rounds) {
    const table = el("div", { class: "roster-list" });
    computeStandings(teamIds, rounds).forEach((s, idx) => {
      const r = el("div", { class: "roster-row" });
      r.appendChild(el("span", { class: "roster-name" }, `${idx + 1}. ${label(s.id)}`));
      const info = el("div", { style: "display:flex;flex-direction:column;align-items:flex-end;gap:2px" });
      info.appendChild(el("span", { class: "chip-btn" }, `${s.points} Pkt`));
      info.appendChild(el("span", { class: "control-hint" }, `${s.wins}S ${s.draws}U ${s.losses}N · Tore ${s.gf}:${s.ga}`));
      r.appendChild(info);
      table.appendChild(r);
    });
    return table;
  }

  function roundsBlock(title, rounds) {
    const box = el("div", { class: "control-panel" });
    box.appendChild(el("label", { class: "control-label" }, title));
    let lastLeg = null;
    rounds.forEach((round, ridx) => {
      const leg = round[0] && round[0].leg;
      if (leg && leg !== lastLeg) {
        box.appendChild(el("div", { class: "control-label", style: "margin-top:6px" }, leg === 1 ? "Hinrunde" : "Rückrunde"));
        lastLeg = leg;
      }
      box.appendChild(el("div", { class: "control-hint" }, `Runde ${ridx + 1}`));
      const list = el("div", { class: "roster-list" });
      round.forEach(m => list.appendChild(matchRow(m, false)));
      box.appendChild(list);
    });
    return box;
  }

  function knockoutBlock(koRounds, title, onAdvance) {
    const box = el("div", { class: "control-panel" });
    box.appendChild(el("label", { class: "control-label" }, title));
    koRounds.forEach((round, ridx) => {
      box.appendChild(el("div", { class: "control-hint" }, `Runde ${ridx + 1}`));
      const list = el("div", { class: "roster-list" });
      round.forEach(m => list.appendChild(matchRow(m, true)));
      box.appendChild(list);
    });
    const last = koRounds[koRounds.length - 1];
    const decided = allDecided(last);
    if (decided && last.length > 1) {
      box.appendChild(el("button", { class: "btn-primary-sm", onClick: () => { onAdvance(); saveState(); render(); } }, "Nächste Runde erstellen"));
    } else if (decided && last.length === 1) {
      box.appendChild(el("div", { class: "empty-roster", style: "color:#D9A427;font-weight:600" }, `🏆 Champion: ${label(last[0].winner)}`));
    }
    return box;
  }

  function doubleElimBlock(de) {
    const box = el("div", {});
    box.appendChild(roundsBlockKo("Winner-Bracket", de.wbRounds));
    if (de.lbRounds.length > 0) box.appendChild(roundsBlockKo("Verlierer-Bracket", de.lbRounds));

    if (de.grandFinal) {
      const gfBox = el("div", { class: "control-panel" });
      gfBox.appendChild(el("label", { class: "control-label" }, "🏆 Grand Final"));
      const list = el("div", { class: "roster-list" });
      list.appendChild(matchRow(de.grandFinal, true));
      gfBox.appendChild(list);
      box.appendChild(gfBox);
    }
    if (de.bracketReset) {
      const brBox = el("div", { class: "control-panel" });
      brBox.appendChild(el("label", { class: "control-label" }, "🏆 Finale — 2. Spiel (Bracket-Reset)"));
      const list = el("div", { class: "roster-list" });
      list.appendChild(matchRow(de.bracketReset, true));
      brBox.appendChild(list);
      box.appendChild(brBox);
    }

    if (de.champion != null) {
      box.appendChild(el("div", { class: "empty-roster", style: "color:#D9A427;font-weight:600;text-align:center" }, `🏆 Champion: ${label(de.champion)}`));
    } else {
      box.appendChild(el("button", { class: "btn-primary-sm", onClick: () => { advanceDoubleElim(de); saveState(); render(); } }, "Weiter"));
    }
    return box;
  }

  function roundsBlockKo(title, rounds) {
    const box = el("div", { class: "control-panel" });
    box.appendChild(el("label", { class: "control-label" }, title));
    rounds.forEach((round, ridx) => {
      box.appendChild(el("div", { class: "control-hint" }, `Runde ${ridx + 1}`));
      const list = el("div", { class: "roster-list" });
      round.forEach(m => list.appendChild(matchRow(m, true)));
      box.appendChild(list);
    });
    return box;
  }

  // ---- Einrichtung ----
  if (!t) {
    const saved = activeClass.tournaments || [];
    if (saved.length > 0) {
      const listBox = el("div", { class: "control-panel" });
      listBox.appendChild(el("label", { class: "control-label" }, "Gespeicherte Turniere"));
      const list = el("div", { class: "roster-list" });
      saved.slice().reverse().forEach(st => {
        const formatLabel = (TOUR_FORMATS.find(f => f.key === st.format) || {}).label || st.format;
        const done = isTournamentComplete(st);
        const row = el("div", { class: "roster-row" });
        const info = el("div", { style: "display:flex;flex-direction:column;gap:2px;flex:1;cursor:pointer", onClick: () => openTournament(st.id) });
        info.appendChild(el("span", { class: "roster-name" }, st.label));
        info.appendChild(el("span", { class: "control-hint" }, `${formatLabel} · ${new Date(st.createdAt).toLocaleDateString("de-DE")} · ${done ? "abgeschlossen" : "läuft"}`));
        row.appendChild(info);
        row.appendChild(el("button", { class: "icon-btn", onClick: () => { if (confirm(`"${st.label}" wirklich löschen?`)) deleteTournament(st.id); } }, "🗑"));
        list.appendChild(row);
      });
      listBox.appendChild(list);
      wrap.appendChild(listBox);
    }

    if (!state.teams || state.teams.length < 2) {
      wrap.appendChild(el("div", { class: "empty-roster" }, `Bilde zuerst unter "Teams erstellen" mindestens 2 Teams, um ein neues Turnier zu starten.`));
      return wrap;
    }

    const panel = el("div", { class: "control-panel" });
    panel.appendChild(el("div", {}, [
      el("label", { class: "control-label" }, "Neues Turnier — Format"),
    ]));
    const select = el("select", { class: "text-input" });
    TOUR_FORMATS.forEach(f => {
      const opt = el("option", { value: f.key }, f.label);
      if (f.key === state.tourFormat) opt.setAttribute("selected", "selected");
      select.appendChild(opt);
    });
    select.addEventListener("change", (e) => { state.tourFormat = e.target.value; render(); });
    panel.appendChild(select);

    panel.appendChild(el("div", {}, [
      el("label", { class: "control-label" }, "Gleichzeitige Spielfelder"),
      el("div", { class: "stepper" }, [
        el("button", { class: "stepper-btn", onClick: () => { state.tourFields = Math.max(1, state.tourFields - 1); render(); } }, "−"),
        el("span", { class: "stepper-value" }, String(state.tourFields)),
        el("button", { class: "stepper-btn", onClick: () => { state.tourFields = Math.min(10, state.tourFields + 1); render(); } }, "+"),
      ]),
    ]));

    const isGroupsFormat = state.tourFormat === "groupsKnockout" || state.tourFormat === "groupsDoubleElim";
    if (isGroupsFormat) {
      panel.appendChild(el("div", {}, [
        el("label", { class: "control-label" }, "Anzahl Gruppen"),
        el("div", { class: "stepper" }, [
          el("button", { class: "stepper-btn", onClick: () => { state.tourGroupsCount = Math.max(2, state.tourGroupsCount - 1); render(); } }, "−"),
          el("span", { class: "stepper-value" }, String(state.tourGroupsCount)),
          el("button", { class: "stepper-btn", onClick: () => { state.tourGroupsCount = Math.min(8, state.tourGroupsCount + 1); render(); } }, "+"),
        ]),
      ]));
      panel.appendChild(el("div", {}, [
        el("label", { class: "control-label" }, "Aufsteiger pro Gruppe"),
        el("div", { class: "stepper" }, [
          el("button", { class: "stepper-btn", onClick: () => { state.tourGroupsAdvance = Math.max(1, state.tourGroupsAdvance - 1); render(); } }, "−"),
          el("span", { class: "stepper-value" }, String(state.tourGroupsAdvance)),
          el("button", { class: "stepper-btn", onClick: () => { state.tourGroupsAdvance = Math.min(4, state.tourGroupsAdvance + 1); render(); } }, "+"),
        ]),
      ]));
      if (state.teams.length < state.tourGroupsCount * 2) {
        panel.appendChild(el("div", { class: "control-hint", style: "color:#E8A798" }, "Für so viele Gruppen sind mehr Teams empfehlenswert."));
      }
      panel.appendChild(el("div", {}, [
        el("label", { class: "control-label" }, "Innerhalb der Gruppen"),
        el("div", { class: "mode-row" }, [
          el("button", { class: "mode-btn" + (!state.tourReturnLeg ? " active" : ""), onClick: () => { state.tourReturnLeg = false; render(); } }, "Nur Hinrunde"),
          el("button", { class: "mode-btn" + (state.tourReturnLeg ? " active" : ""), onClick: () => { state.tourReturnLeg = true; render(); } }, "Mit Rückrunde"),
        ]),
      ]));
    }

    if (state.tourFormat === "roundrobin") {
      panel.appendChild(el("div", {}, [
        el("label", { class: "control-label" }, "Spielrunden"),
        el("div", { class: "mode-row" }, [
          el("button", { class: "mode-btn" + (!state.tourReturnLeg ? " active" : ""), onClick: () => { state.tourReturnLeg = false; render(); } }, "Nur Hinrunde"),
          el("button", { class: "mode-btn" + (state.tourReturnLeg ? " active" : ""), onClick: () => { state.tourReturnLeg = true; render(); } }, "Mit Rückrunde"),
        ]),
      ]));
    }

    const isDoubleElim = state.tourFormat === "doubleElim" || state.tourFormat === "groupsDoubleElim";
    if (isDoubleElim) {
      panel.appendChild(el("div", {}, [
        el("label", { class: "control-label" }, "Finale bei Team aus dem Verlierer-Bracket"),
        el("div", { class: "mode-row" }, [
          el("button", { class: "mode-btn" + (state.tourDeFinalMode === "single" ? " active" : ""), onClick: () => { state.tourDeFinalMode = "single"; render(); } }, "Ein Finalspiel"),
          el("button", { class: "mode-btn" + (state.tourDeFinalMode === "reset" ? " active" : ""), onClick: () => { state.tourDeFinalMode = "reset"; render(); } }, "Bracket-Reset (2. Finale bei Bedarf)"),
        ]),
      ]));
    }

    const isSwissFormat = state.tourFormat === "swiss" || state.tourFormat === "swissKnockout";
    if (isSwissFormat) {
      panel.appendChild(el("div", {}, [
        el("label", { class: "control-label" }, "Rundenzahl"),
        el("div", { class: "mode-row" }, [
          el("button", { class: "mode-btn" + (state.tourSwissRoundsMode === "auto" ? " active" : ""), onClick: () => { state.tourSwissRoundsMode = "auto"; render(); } }, `Automatisch (${autoSwissRounds(state.teams.length)})`),
          el("button", { class: "mode-btn" + (state.tourSwissRoundsMode === "manual" ? " active" : ""), onClick: () => { state.tourSwissRoundsMode = "manual"; render(); } }, "Selbst festlegen"),
        ]),
      ]));
      if (state.tourSwissRoundsMode === "manual") {
        panel.appendChild(el("div", {}, [
          el("label", { class: "control-label" }, "Anzahl Runden"),
          el("div", { class: "stepper" }, [
            el("button", { class: "stepper-btn", onClick: () => { state.tourSwissRoundsManual = Math.max(1, state.tourSwissRoundsManual - 1); render(); } }, "−"),
            el("span", { class: "stepper-value" }, String(state.tourSwissRoundsManual)),
            el("button", { class: "stepper-btn", onClick: () => { state.tourSwissRoundsManual = Math.min(state.teams.length - 1 || 1, state.tourSwissRoundsManual + 1); render(); } }, "+"),
          ]),
        ]));
      }
    }
    if (state.tourFormat === "swissKnockout") {
      panel.appendChild(el("div", {}, [
        el("label", { class: "control-label" }, "Wie viele kommen in die K.-o.-Runde"),
        el("div", { class: "stepper" }, [
          el("button", { class: "stepper-btn", onClick: () => { state.tourSwissQualifiers = Math.max(2, state.tourSwissQualifiers - 1); render(); } }, "−"),
          el("span", { class: "stepper-value" }, String(state.tourSwissQualifiers)),
          el("button", { class: "stepper-btn", onClick: () => { state.tourSwissQualifiers = Math.min(state.teams.length, state.tourSwissQualifiers + 1); render(); } }, "+"),
        ]),
      ]));
    }

    const supportsPlacement = ["knockout", "groupsKnockout", "swissKnockout"].includes(state.tourFormat);
    if (supportsPlacement) {
      panel.appendChild(el("div", {}, [
        el("label", { class: "control-label" }, "Platzierungsspiele"),
        el("div", { class: "mode-row" }, [
          el("button", { class: "mode-btn" + (state.tourPlacement === "none" ? " active" : ""), onClick: () => { state.tourPlacement = "none"; render(); } }, "Keine"),
          el("button", { class: "mode-btn" + (state.tourPlacement === "third" ? " active" : ""), onClick: () => { state.tourPlacement = "third"; render(); } }, "Spiel um Platz 3"),
          el("button", { class: "mode-btn" + (state.tourPlacement === "full" ? " active" : ""), onClick: () => { state.tourPlacement = "full"; render(); } }, "Alle Platzierungen"),
        ]),
      ]));
    }

    panel.appendChild(el("button", { class: "btn-primary", onClick: startTournament }, "🏆 Turnier erstellen"));
    panel.appendChild(el("div", { class: "control-hint" }, `Aktuelle Teams: ${state.teams.length}`));
    wrap.appendChild(panel);
    return wrap;
  }

  // ---- Laufendes Turnier ----
  const titleRow = el("div", { class: "class-name-row" });
  if (state.editingTournamentId === t.id) {
    const input = el("input", { class: "class-name-input", value: t.label });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { renameTournament(t.id, input.value); state.editingTournamentId = null; render(); }
    });
    titleRow.appendChild(input);
    titleRow.appendChild(el("button", { class: "icon-btn", onClick: () => { renameTournament(t.id, input.value); state.editingTournamentId = null; render(); } }, "✓"));
    setTimeout(() => input.focus(), 0);
  } else {
    titleRow.appendChild(el("h2", { style: "font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;margin:0" }, t.label));
    titleRow.appendChild(el("button", { class: "icon-btn", onClick: () => { state.editingTournamentId = t.id; render(); } }, "✎"));
  }
  wrap.appendChild(titleRow);

  wrap.appendChild(el("div", { class: "add-row" }, [
    el("button", { class: "chip-btn", onClick: closeTournament }, "📋 Alle Turniere"),
    el("button", { class: "chip-btn", onClick: () => exportTournamentPDF(activeClass, t) }, "📄 Als PDF exportieren"),
    el("button", { class: "chip-btn", onClick: () => exportTournamentWord(activeClass, t) }, "📝 Als Word exportieren"),
    el("button", { class: "chip-btn", onClick: () => { if (confirm(`"${t.label}" wirklich löschen?`)) deleteTournament(t.id); } }, "🗑 Löschen"),
  ]));

  if (t.format === "roundrobin") {
    wrap.appendChild(roundsBlock("Spielplan", t.rounds));
    const standingsBox = el("div", { class: "control-panel" });
    standingsBox.appendChild(el("label", { class: "control-label" }, "🏆 Tabelle"));
    standingsBox.appendChild(standingsTable(t.teamIds, t.rounds));
    wrap.appendChild(standingsBox);
  } else if (t.format === "knockout") {
    refreshPlacements(t);
    wrap.appendChild(knockoutBlock(t.koRounds, "K.-o.-Runde", () => tryAdvanceKnockout(t.koRounds)));
    (t.placementPools || []).slice().sort((a, b) => a.startRank - b.startRank).forEach(p => {
      wrap.appendChild(knockoutBlock(p.rounds, placementPoolLabel(p), () => tryAdvanceKnockout(p.rounds)));
    });
  } else if (t.format === "doubleElim") {
    wrap.appendChild(doubleElimBlock(t.de));
  } else if (t.format === "groupsKnockout" || t.format === "groupsDoubleElim") {
    t.groups.forEach((g, gi) => {
      const box = el("div", { class: "control-panel" });
      box.appendChild(el("label", { class: "control-label" }, `Gruppe ${String.fromCharCode(65 + gi)}`));
      let lastLeg = null;
      g.rounds.forEach((round, ridx) => {
        const leg = round[0] && round[0].leg;
        if (leg && leg !== lastLeg) {
          box.appendChild(el("div", { class: "control-label", style: "margin-top:6px" }, leg === 1 ? "Hinrunde" : "Rückrunde"));
          lastLeg = leg;
        }
        box.appendChild(el("div", { class: "control-hint" }, `Runde ${ridx + 1}`));
        const list = el("div", { class: "roster-list" });
        round.forEach(m => list.appendChild(matchRow(m, false)));
        box.appendChild(list);
      });
      box.appendChild(el("div", { class: "control-hint" }, "Tabelle"));
      box.appendChild(standingsTable(g.teamIds, g.rounds));
      wrap.appendChild(box);
    });

    const allGroupsDone = t.groups.every(g => g.rounds.every(r => allDecided(r)));
    if (t.format === "groupsKnockout") {
      if (allGroupsDone && !t.koFromGroups) {
        wrap.appendChild(el("button", { class: "btn-primary", onClick: startKnockoutFromGroups }, "🏆 Zur K.-o.-Runde"));
      }
      if (t.koFromGroups) {
        refreshPlacements(t);
        wrap.appendChild(knockoutBlock(t.koFromGroups, "🏆 K.-o.-Runde", () => tryAdvanceKnockout(t.koFromGroups)));
        (t.placementPools || []).slice().sort((a, b) => a.startRank - b.startRank).forEach(p => {
          wrap.appendChild(knockoutBlock(p.rounds, placementPoolLabel(p), () => tryAdvanceKnockout(p.rounds)));
        });
      }
    } else {
      if (allGroupsDone && !t.deFromGroups) {
        wrap.appendChild(el("button", { class: "btn-primary", onClick: startDoubleElimFromGroups }, "🏆 Zur Doppel-K.-o.-Runde"));
      }
      if (t.deFromGroups) {
        wrap.appendChild(doubleElimBlock(t.deFromGroups));
      }
    }
  } else if (t.format === "swiss" || t.format === "swissKnockout") {
    const sw = t.swiss;
    wrap.appendChild(el("div", { class: "control-hint", style: "text-align:center;margin-bottom:6px" }, `Runde ${sw.rounds.length} von ${sw.totalRounds}`));
    wrap.appendChild(roundsBlock("Schweizer System", sw.rounds));

    const standingsBox = el("div", { class: "control-panel" });
    standingsBox.appendChild(el("label", { class: "control-label" }, sw.rounds.length >= sw.totalRounds ? "🏆 Endstand" : "Zwischenstand"));
    standingsBox.appendChild(standingsTable(t.teamIds, sw.rounds));
    wrap.appendChild(standingsBox);

    const lastRound = sw.rounds[sw.rounds.length - 1];
    if (allDecided(lastRound) && sw.rounds.length < sw.totalRounds) {
      wrap.appendChild(el("button", { class: "btn-primary", onClick: () => {
        sw.rounds.push(buildSwissRound(t.teamIds, sw.rounds));
        saveState(); render();
      } }, "Nächste Runde erstellen"));
    }

    if (t.format === "swissKnockout" && allDecided(lastRound) && sw.rounds.length >= sw.totalRounds) {
      if (!t.koFromSwiss) {
        wrap.appendChild(el("button", { class: "btn-primary", onClick: startKnockoutFromSwiss }, "🏆 Zur K.-o.-Runde"));
      } else {
        refreshPlacements(t);
        wrap.appendChild(knockoutBlock(t.koFromSwiss, "🏆 K.-o.-Runde", () => tryAdvanceKnockout(t.koFromSwiss)));
        (t.placementPools || []).slice().sort((a, b) => a.startRank - b.startRank).forEach(p => {
          wrap.appendChild(knockoutBlock(p.rounds, placementPoolLabel(p), () => tryAdvanceKnockout(p.rounds)));
        });
      }
    }
  }

  return wrap;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(renderHeader());

  if (state.view === "classpicker" || state.classes.length === 0) {
    app.appendChild(renderClassPickerView());
    return;
  }

  const activeClass = getActiveClass();
  if (!activeClass) {
    app.appendChild(renderClassPickerView());
    return;
  }
  app.appendChild(renderSubHeader(activeClass));
  let viewNode;
  if (state.view === "class") viewNode = state.classSubview === "rules" ? renderRulesView(activeClass) : renderRosterView(activeClass);
  else if (state.view === "generate") viewNode = renderGenerateView(activeClass);
  else if (state.view === "pick") viewNode = renderPickView(activeClass);
  else if (state.view === "tournament") viewNode = renderTournamentView(activeClass);
  else viewNode = renderHomeView(activeClass);
  app.appendChild(viewNode);
}

loadState();
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {
      // Offline-Unterstützung ist optional — App funktioniert auch ohne
    });
  });
}
</script>
</body>
</html>
